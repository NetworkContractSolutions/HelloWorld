parameters:
- name: RepoAlias
  displayName: Repository Alias (for checkout step)
  type: string
  default: 'infrastructure'
- name: ServiceConnectionName
  displayName: Service Connection Name
  type: string
- name: EnvironmentName
  displayName: Environment Name (Feature01, Feature02, Production)
  type: string
- name: ContainerAppName
  displayName: Container App Name
  type: string
- name: ApplicationName
  displayName: Application Name (for CAE selection in production)
  type: string
  default: 'default' # Use 'default' for non-production environments

steps:
- ${{ if eq(parameters.RepoAlias, 'self') }}:
  - checkout: self
    path: s/ncontracts-infra-template

- ${{ if ne(parameters.RepoAlias, 'self') }}:
  - checkout: ${{ parameters.RepoAlias }}
    path: s/ncontracts-infra-template
    sparseCheckoutPatterns: |
      - /Pipelines/Resources/
      - /Subscriptions/Ncontracts_DevTest/Subscription.json
      - /Subscriptions/Ncontracts_Prod/Subscription.json
      - /Environments/Dev/**/*.json
      - /Environments/Prod/**/*.json

- task: AzureCLI@2
  displayName: 'Remove CAE Integration'
  inputs:
    azureSubscription: '${{ parameters.ServiceConnectionName }}'
    scriptType: 'pscore'
    scriptLocation: 'inlineScript'
    inlineScript: |
      $repoPath = "$(Pipeline.Workspace)/s/ncontracts-infra-template"

      . $repoPath/Pipelines/Resources/devops.ps1
      . $repoPath/Pipelines/Resources/appgateway.ps1
      $containerAppName = '${{ parameters.ContainerAppName }}'
      $environmentName = '${{ parameters.EnvironmentName }}'.ToLower().Replace('feature-', '')
      $environmentJson = ($environmentName.Substring(0,1).ToUpper() + $environmentName.Substring(1)) + '.json'
      
      # Determine subscription and environment paths based on environment
      if ($environmentName -eq 'production' -or $environmentName -contains 'prod') {
        $subscriptionPath = "$repoPath/Subscriptions/Ncontracts_Prod/Subscription.json"
        $environmentPath = "$repoPath/Environments/Prod/Parameters/Production.json"
        $isProd = $true
      } else {
        $subscriptionPath = "$repoPath/Subscriptions/Ncontracts_DevTest/Subscription.json"
        $environmentPath = "$repoPath/Environments/Dev/Parameters/$environmentJson"
        $isProd = $false
      }

      $subscriptionConfig = (Get-Parameters -filePath $subscriptionPath).subscriptionConfig.value
      Validate-Context -subscriptionId $subscriptionConfig.subscriptionId
      $envConfig = (Get-Parameters -filePath $environmentPath).environmentConfig.value
        
      # Filter CAE configs based on application name (for production)
      $applicationName = '${{ parameters.ApplicationName }}'

      # In production with multiple CAEs, filter by application
      if ($isProd) {
        if ([string]::IsNullOrWhiteSpace($applicationName)) { throw "ApplicationName parameter is required for production environment" }

        $caeConfigsToProcess = $envConfig.caeConfigs | Where-Object { $_.applications -contains $applicationName }
        if ($caeConfigsToProcess.Count -eq 0) { throw "No CAE found for application: $applicationName" }
        if ($caeConfigsToProcess.Count -gt 1) { throw "Multiple CAEs found for application: $applicationName. Ensure each application is only in one CAE's 'applications' array." }

        $caeConfig = $caeConfigsToProcess[0]
      } else {
        $caeConfigsToProcess = $envConfig.caeConfigs

        # For feature environments or we currently only support one CAE
        Write-Host "Processing $environmentName CAE configuration(s)"
        if ($caeConfigsToProcess.Count -eq 0) { throw "No CAE configurations found in environment config" }
        $caeConfig = $caeConfigsToProcess[0]
      }

      Write-Host "-----------------------------------------------------"
      Write-Host "Remove CAE Integration for $($caeConfig.name)"

      Remove-ContainerAppIntegration `
        -SubscriptionConfig $subscriptionConfig `
        -EnvironmentConfig $envConfig `
        -CaeConfig $caeConfig `
        -ContainerAppName $containerAppName