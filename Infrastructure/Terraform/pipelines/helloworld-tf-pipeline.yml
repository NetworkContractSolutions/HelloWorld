parameters:
- name: EnvironmentName
  displayName: Environment Name
  type: string
  values:
  - POC01
  - Feature01
  - Feature02
  - Prod
  default: 'POC01'
- name: teardown
  displayName: Teardown Environment
  type: boolean
  default: false

trigger: none

resources:
  repositories:
  - repository: infrastructure
    type: github
    name: NetworkContractSolutions/Ncontracts.Infrastructure
    endpoint: NContractsGithub
    ref: poc01-cae-agw # point to main before merging

variables:
  ContainerRegistryRepository: 'helloworld'
  Location: 'centralus'
  ContainerAppName: 'ca-helloworld-${{ lower(parameters.EnvironmentName) }}-usc-$(Build.BuildId)'
  EnvironmentName: '${{ lower(parameters.EnvironmentName) }}'
  ResourceGroup: 'rg-helloworld-${{ lower(parameters.EnvironmentName) }}-usc'
  ContainerAppEnvironmentName: 'cae-${{ lower(parameters.EnvironmentName) }}-usc'
  #Variables that are defined in the pipeline
  #ContainerRegistrySC: <Service Connection for the Container Registry>
  #AzureResourceManagerSC: <Name of the Azure Resource Manager service connection>
  ManagedIdentityName: 'uami-helloworld-${{ lower(parameters.EnvironmentName) }}-usc'
  ManagedIdentityResourceGroupName: 'rg-helloworld-${{ lower(parameters.EnvironmentName) }}-usc'
  ContainerRegistryLoginServer: '$(ContainerRegistryLoginServer)'
  ContainerAppEnvironment: '$(ContainerAppEnvironment)'

stages:
- stage: Build
  displayName: Build stage
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Package
    displayName: Package job
    steps:
    - task: Docker@2
      displayName: Build and Push
      inputs:
        command: buildAndPush
        containerRegistry: '$(ContainerRegistrySC)'
        repository: '$(ContainerRegistryRepository)'
        tags: $(Build.BuildId)
        Dockerfile: '**/HelloWorld/Dockerfile'

- stage: TerraformPlan
  displayName: Terraform Plan
  dependsOn: Build
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Plan
    displayName: Terraform Plan job
    steps:
    - checkout: self
      path: s/helloworld

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: 'Terraform Init and Plan'
      inputs:
        azureSubscription: '$(AzureResourceManagerSC)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
        inlineScript: |
          # Define a unique state file key for this build
          STATE_FILE_KEY="helloworld-$(EnvironmentName)-$(Build.BuildId).tfstate"
          echo "Using state file: $STATE_FILE_KEY"
          
          terraform init \
            -backend-config="key=$STATE_FILE_KEY"
          
          terraform plan \
            -var="container_app_name=$(ContainerAppName)" \
            -var="environment=$(EnvironmentName)" \
            -var="location=$(Location)" \
            -var="existing_cae_resource_group_name=$(ResourceGroup)" \
            -var="existing_container_app_environment_name=$(ContainerAppEnvironmentName)" \
            -var="managed_identity_name=$(ManagedIdentityName)" \
            -var="managed_identity_resource_group_name=$(ManagedIdentityResourceGroupName)" \
            -var="container_registry_login_server=$(ContainerRegistryLoginServer)" \
            -var="container_image=$(ContainerRegistryLoginServer)/$(ContainerRegistryRepository):$(Build.BuildId)" \
            -var="target_port=8080" \
            -out=tfplan

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

- stage: TerraformApply
  displayName: Terraform Apply
  dependsOn: TerraformPlan
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - deployment: Apply
    displayName: Terraform Apply job
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: s/helloworld

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: 'Terraform Init and Apply'
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
              inlineScript: |
                # Define a unique state file key for this build
                STATE_FILE_KEY="helloworld-$(EnvironmentName)-$(Build.BuildId).tfstate"
                echo "Using state file: $STATE_FILE_KEY"
                
                terraform init \
                  -backend-config="key=$STATE_FILE_KEY"
                
                terraform apply -auto-approve tfplan

          - template: Templates/Tasks/InitializeCAE1.yml@infrastructure
            parameters:
              ServiceConnectionName: '$(AzureResourceManagerSC)'
              EnvironmentName: '$(EnvironmentName)'
              BrowserFriendlyRouting: true
              ContainerAppFilter: '^$(ContainerAppName)$'
              InternalOnly: true

          - task: AzureCLI@2
            displayName: 'Get Container App URL'
            name: retrieveurl
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $aca = az containerapp list -g $(ResourceGroup) | ConvertFrom-Json | Where-Object {$_.name -eq "$(ContainerAppName)"} | Select-Object -First 1
                $url = "https://" + $aca.properties.configuration.ingress.fqdn
                Write-Host "##vso[task.setvariable variable=IngressContainerAppUrl;isOutput=true]$url"

                $deployment = '$(ContainerAppName)-$(EnvironmentName).dev.ncontracts.com'
                Write-Host "DevNcontracts Container App URL: $deployment"
                Write-Host "##vso[task.setvariable variable=ContainerAppUrl;isOutput=true]$deployment"

