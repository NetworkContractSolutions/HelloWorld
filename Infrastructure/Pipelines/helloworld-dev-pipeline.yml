parameters:
- name: EnvironmentName
  displayName: Environment Name (poc01, feature01, feature02, etc.)
  type: string
  default: 'poc01'
- name: teardown
  displayName: Teardown Environment
  type: boolean
  default: true

trigger: none
#   paths:
#     include:
#     - 'Infrastructure/Pipelines/*'
#     - 'HelloWorld/*'
#     - 'HelloWorld.IntegrationTests/*'

resources:
  repositories:
  - repository: infrastructure
    type: github
    name: NetworkContractSolutions/Ncontracts.Infrastructure
    endpoint: NContractsGithub
    ref: main

variables:
  ContainerRegistryRepository: 'helloworld'
  Region: 'centralus'
  ContainerAppName: 'helloworld-dev-ca-$(Build.BuildId)'
  EnvironmentName: '${{ lower(parameters.EnvironmentName) }}'
  ResourceGroup: 'rg-${{ lower(parameters.EnvironmentName) }}-usc'
  #Variables that are defined in the pipeline
  ContainerAppEnvironmentName: 'cae-${{ lower(parameters.EnvironmentName) }}-usc'
  ManagedIdentityName: 'mi-dev-devops-usc'
  ManagedIdentityResourceGroupName: 'rg-dev-devops-usc'
  ContainerRegistryLoginServer: 'ncontracts.azurecr.io'
  AzureResourceManagerSC: 'Dev-Limited'
  ContainerRegistrySC: 'NContractsSC'
  #LogAnalyticsWorkspace
  #LogAnalyticsResourceGroup: <Log analytics isn't created here and we can't assume that the container app and log analytics will be in the same resource group>
  #ContainerRegistryUsername
  #ContainerRegistryPassword
  #ContainerAppEnvironmentId: <The id of the container app environment (az containerapp env list)>

stages:
- stage: Build
  displayName: Build stage
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Package
    displayName: Package job
    steps:
    - task: Docker@2
      displayName: Build and Push
      inputs:
        command: buildAndPush
        containerRegistry: '$(ContainerRegistrySC)'
        repository: '$(ContainerRegistryRepository)'
        tags: $(Build.BuildId)
        Dockerfile: '**/HelloWorld/Dockerfile'

# New Terraform Plan stage
- stage: TerraformPlan
  displayName: Terraform Plan Stage
  dependsOn: Build
  condition: succeeded('Build')
  pool: "WindowsAgents"
  jobs:
  - job: Plan
    displayName: Terraform Plan job
    steps:
    - checkout: self
      path: s/helloworld

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: 'Terraform Plan'
      inputs:
        azureSubscription: '$(AzureResourceManagerSC)'
        scriptType: 'pscore' #'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
        inlineScript: |
          # Define a unique state file key for this build
          $STATE_FILE_KEY = "helloworld-$(EnvironmentName)-$(Build.BuildId).tfstate"
          Write-Host "Using state file: $STATE_FILE_KEY"
          
          terraform init `
            --backend-config="key=$STATE_FILE_KEY" `
            --reconfigure
          
          terraform plan `
            --var="container_app_name=$(ContainerAppName)" `
            --var="environment=$(EnvironmentName)" `
            --var="location=$(Region)" `
            --var="existing_cae_resource_group_name=$(ResourceGroup)" `
            --var="existing_container_app_environment_name=$(ContainerAppEnvironmentName)" `
            --var="managed_identity_name=$(ManagedIdentityName)" `
            --var="managed_identity_resource_group_name=$(ManagedIdentityResourceGroupName)" `
            --var="container_registry_login_server=$(ContainerRegistryLoginServer)" `
            --var="container_image=$(ContainerRegistryLoginServer)/$(ContainerRegistryRepository):$(Build.BuildId)" `
            --var="target_port=8080" `
            --out=tfplan

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

- stage: Deploy
  displayName: Terraform Apply Stage
  dependsOn: TerraformPlan
  condition: succeeded('TerraformPlan')
  pool: "WindowsAgents"
  jobs:
  - deployment: Deploy
    displayName: Deploy job
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: s/helloworld

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: 'Terraform Apply'
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'pscore' #'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
              inlineScript: |
                # Define a unique state file key for this build
                $STATE_FILE_KEY = "helloworld-$(EnvironmentName)-$(Build.BuildId).tfstate"
                Write-Host "Using state file: $STATE_FILE_KEY"
                
                terraform init `
                  --backend-config="key=$STATE_FILE_KEY" `
                  --reconfigure
                
                terraform apply --auto-approve tfplan

          - template: Templates/Tasks/InitializeCAE1.yml@infrastructure
            parameters:
              ServiceConnectionName: '$(AzureResourceManagerSC)'
              EnvironmentName: '$(EnvironmentName)'
              BrowserFriendlyRouting: true
              ContainerAppFilter: '^$(ContainerAppName)$'
              InternalOnly: true

          - task: AzureCLI@2
            displayName: 'Get CA URL'
            name: retrieveurl
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $aca = az containerapp list -g $(ResourceGroup) | ConvertFrom-Json | Where-Object {$_.name -eq "$(ContainerAppName)"} | Select-Object -First 1
                $url = "https://" + $aca.properties.configuration.ingress.fqdn
                Write-Host "##vso[task.setvariable variable=IngressContainerAppUrl;isOutput=true]$url"

                $deployment = 'https://$(ContainerAppName)-$(EnvironmentName).dev.ncontracts.com'
                Write-Host "DevNcontracts Container App URL: $deployment"
                Write-Host "##vso[task.setvariable variable=ContainerAppUrl;isOutput=true]$deployment"
      
# Playwright tests against the deployed application
- stage: Test
  displayName: Test stage
  dependsOn: Deploy
  pool: "WindowsAgents"
  jobs:
  - job: RunTests
    displayName: Run Tests
    variables:
      HomePageUrl: $[ stageDependencies.Deploy.Deploy.outputs['Deploy.retrieveurl.ContainerAppUrl'] ]
    steps:
    # Verify URL was passed correctly
    - task: PowerShell@2
      displayName: 'Verify HomePageUrl'
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "HomePageUrl received: $(HomePageUrl)"
          if ([string]::IsNullOrWhiteSpace("$(HomePageUrl)")) {
            Write-Error "HomePageUrl is empty!"
            exit 1
          }
          if (-not "$(HomePageUrl)".StartsWith("http")) {
            Write-Warning "HomePageUrl does not start with http/https: $(HomePageUrl)"
          }
    
    # Build Playwright test project
    - script: dotnet build HelloWorld.IntegrationTests/HelloWorld.IntegrationTests.csproj --configuration Debug
      displayName: 'Build .NET 8 Playwright Test Project'
      env:
        HomePageUrl: $(HomePageUrl)

    # Install Playwright browsers and dependencies
    - task: PowerShell@2
      displayName: 'Install Playwright Browsers and Dependencies'
      env:
        HomePageUrl: $(HomePageUrl)
      inputs:
        targetType: 'inline'
        script: |
          cd HelloWorld.IntegrationTests/bin/Debug/net8.0
          pwsh playwright.ps1 install chromium
          if ($IsLinux) {
            Write-Host "Linux detected, installing system dependencies..."
            pwsh playwright.ps1 install-deps chromium
          } else {
            Write-Host "Windows detected, skipping system dependencies (not needed)"
          }
        workingDirectory: '$(System.DefaultWorkingDirectory)'

    # Run UI tests against the deployed Container App
    - task: DotNetCoreCLI@2
      displayName: 'Run Playwright UI Tests'
      env:
        HomePageUrl: $(HomePageUrl)
      inputs:
        command: test
        projects: 'HelloWorld.IntegrationTests/HelloWorld.IntegrationTests.csproj'
        arguments: '--configuration Debug --no-build'

- stage: Teardown
  displayName: Terraform Destroy Stage
  dependsOn: Deploy #Test
  condition: and(succeeded('Deploy'), eq('${{ parameters.teardown }}', true))
  pool: "WindowsAgents"
  jobs:
  - job: RemoveCAEIntegration
    displayName: Remove CAE Integration job
    continueOnError: true
    steps:
    - template: Templates/Tasks/RemoveCAEIntegration1.yml@infrastructure
      parameters:
        ServiceConnectionName: '$(AzureResourceManagerSC)'
        EnvironmentName: '$(EnvironmentName)'
        ContainerAppName: '$(ContainerAppName)'
      
  - job: TeardownCA
    displayName: Teardown CA job
    steps:
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: 'Terraform Destroy'
      inputs:
        azureSubscription: '$(AzureResourceManagerSC)'
        scriptType: 'pscore' #'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
        inlineScript: |
          # Define a unique state file key for this build
          $STATE_FILE_KEY = "helloworld-$(EnvironmentName)-$(Build.BuildId).tfstate"
          Write-Host "Using state file: $STATE_FILE_KEY"
          
          terraform init `
            --backend-config="key=$STATE_FILE_KEY" `
            --reconfigure

          terraform destroy --auto-approve `
            --var="container_app_name=$(ContainerAppName)" `
            --var="environment=$(EnvironmentName)" `
            --var="location=$(Region)" `
            --var="existing_cae_resource_group_name=$(ResourceGroup)" `
            --var="existing_container_app_environment_name=$(ContainerAppEnvironmentName)" `
            --var="managed_identity_name=$(ManagedIdentityName)" `
            --var="managed_identity_resource_group_name=$(ManagedIdentityResourceGroupName)" `
            --var="container_registry_login_server=$(ContainerRegistryLoginServer)" `
            --var="container_image=$(ContainerRegistryLoginServer)/$(ContainerRegistryRepository):$(Build.BuildId)" `
            --var="target_port=8080"
