parameters:
- name: teardown
  displayName: Teardown Environment
  type: boolean
  default: true

trigger: none
#   paths:
#     include:
#     - 'Infrastructure/Pipelines/*'
#     - 'HelloWorld/*'
#     - 'HelloWorld.IntegrationTests/*'

resources:
  repositories:
  - repository: infrastructure
    type: github
    name: NetworkContractSolutions/Ncontracts.Infrastructure
    endpoint: NContractsGithub
    ref: poc01-cae-agw

variables:
  ContainerRegistryRepository: 'helloworld'
  Region: 'centralus'
  ContainerAppName: 'helloworld-dev-ca-$(Build.BuildId)'
  ResourceGroup: 'rg-poc01-usc'
  #Variables that are defined in the pipeline
  #ContainerRegistrySC: <Service Connection for the Container Registry>
  #AzureResourceManagerSC: <Name of the Azure Resource Manager service connection>
  #LogAnalyticsWorkspace
  #LogAnalyticsResourceGroup: <Log analytics isn't created here and we can't assume that the container app and log analytics will be in the same resource group>
  #ContainerRegistryLoginServer
  #ContainerRegistryUsername
  #ContainerRegistryPassword
  #ContainerAppEnvironment: <The id of the container app environment (az containerapp env list)>

stages:
- stage: Build
  displayName: Build stage
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Package
    displayName: Package job
    steps:
    - task: Docker@2
      displayName: Build and Push
      inputs:
        command: buildAndPush
        containerRegistry: '$(ContainerRegistrySC)'
        repository: '$(ContainerRegistryRepository)'
        tags: $(Build.BuildId)
        Dockerfile: '**/HelloWorld/Dockerfile'

- stage: Deploy
  displayName: Deploy stage
  dependsOn: Build
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - deployment: Deploy
    displayName: Deploy job
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: s/helloworld

          - task: AzureCLI@2
            displayName: 'Container App - Create'
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $repoPath = "$(Pipeline.Workspace)/s/helloworld"

                az deployment group create `
                  --resource-group $(ResourceGroup) `
                  --template-file $repoPath/Infrastructure/Pipelines/container-app.bicep `
                  --parameters `
                    containerAppName='$(ContainerAppName)' `
                    location='$(Region)' `
                    containerAppEnvironmentId='$(ContainerAppEnvironment)' `
                    containerRegistryLoginServer='$(ContainerRegistryLoginServer)' `
                    containerRegistryUsername='$(ContainerRegistryUsername)' `
                    containerRegistryPassword='$(ContainerRegistryPassword)' `
                    containerImage='$(ContainerRegistryLoginServer)/$(ContainerRegistryRepository):$(Build.BuildId)' `
                    targetPort=80

          - template: Templates/Tasks/InitializeCAE1.yml@infrastructure
            parameters:
              ServiceConnectionName: '$(AzureResourceManagerSC)'
              EnvironmentName: 'Poc01'
              BrowserFriendlyRouting: true
              ContainerAppFilter: '^$(ContainerAppName)$'
              InternalOnly: true

          - task: AzureCLI@2
            displayName: 'Get CA URL'
            name: retrieveurl
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $deployment = '$(ContainerAppName)-poc01.dev.ncontracts.com'

                Write-Host "Container App URL: $deployment"
                Write-Host "##vso[task.setvariable variable=ContainerAppUrl;isOutput=true]$deployment"
      
