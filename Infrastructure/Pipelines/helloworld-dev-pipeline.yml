- stage: Teardown
  displayName: Teardown stage
  dependsOn: Test
  condition: eq('${{ parameters.teardown }}', true)
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Teardown
    displayName: Teardown job
    steps:
    - task: AzureCLI@2
      displayName: 'Delete Container App'
      inputs:
        azureSubscription: '$(AzureResourceManagerSC)'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az containerapp delete -n $(ContainerAppName) -g $(ResourceGroup) --yes --no-wait

    - template: Templates/Tasks/RemoveCAEIntegration1.yml@infrastructure
      parameters:
        ServiceConnectionName: '$(AzureResourceManagerSC)'
        EnvironmentName: 'Poc01'
        ContainerAppName: '$(ContainerAppName)'
