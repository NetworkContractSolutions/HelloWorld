parameters:
- name: EnvironmentName
  displayName: Environment Name (poc01, feature01, feature02, etc.)
  type: string
  default: 'poc01'
- name: teardown
  displayName: Teardown Environment
  type: boolean
  default: true

trigger: none
#   paths:
#     include:
#     - 'Infrastructure/Pipelines/*'
#     - 'HelloWorld/*'
#     - 'HelloWorld.IntegrationTests/*'

resources:
  repositories:
  - repository: infrastructure
    type: github
    name: NetworkContractSolutions/Ncontracts.Infrastructure
    endpoint: NContractsGithub
    ref: poc01-cae-agw # point to main before merging

variables:
  ContainerRegistryRepository: 'helloworld'
  Region: 'centralus'
  ContainerAppName: 'helloworld-dev-ca-$(Build.BuildId)'
  EnvironmentName: '${{ lower(parameters.EnvironmentName) }}'
  ResourceGroup: 'rg-${{ lower(parameters.EnvironmentName) }}-usc'
  #Variables that are defined in the pipeline
  ContainerAppEnvironmentName: 'cae-${{ lower(parameters.EnvironmentName) }}-usc'
  ManagedIdentityName: 'mi-dev-devops-usc'
  ManagedIdentityResourceGroupName: 'rg-dev-devops-usc'
  ContainerRegistryLoginServer: 'ncontracts.azurecr.io'
  AzureResourceManagerSC: 'Dev-Limited'
  ContainerRegistrySC: 'NContractsSC'
  #LogAnalyticsWorkspace
  #LogAnalyticsResourceGroup: <Log analytics isn't created here and we can't assume that the container app and log analytics will be in the same resource group>
  #ContainerRegistryUsername
  #ContainerRegistryPassword
  #ContainerAppEnvironmentId: <The id of the container app environment (az containerapp env list)>

stages:
- stage: Build
  displayName: Build stage
  pool:
    vmImage: 'ubuntu-latest'
  jobs:
  - job: Package
    displayName: Package job
    steps:
    - task: Docker@2
      displayName: Build and Push
      inputs:
        command: buildAndPush
        containerRegistry: '$(ContainerRegistrySC)'
        repository: '$(ContainerRegistryRepository)'
        tags: $(Build.BuildId)
        Dockerfile: '**/HelloWorld/Dockerfile'

# New Terraform Plan stage
- stage: TerraformPlan
  displayName: Terraform Plan Stage
  dependsOn: Build
  condition: succeeded('Build')
  pool: "WindowsAgents"
  jobs:
  - job: Plan
    displayName: Terraform Plan job
    steps:
    - checkout: self
      path: s/helloworld

    - task: AzureCLI@2
      displayName: 'Debug Storage Access and Permissions'
      inputs:
        azureSubscription: '$(AzureResourceManagerSC)'
        scriptType: 'pscore'
        scriptLocation: 'inlineScript'
        inlineScript: |
          Write-Host "=== Network Diagnostics ==="
          Write-Host "Agent IP should be: 10.20.0.57 << this will change when the agent is moved to another subnet"
          Write-Host "Storage Private IP: 10.7.69.4"
          
          # Test connectivity to storage private endpoint
          Test-NetConnection -ComputerName "sadevterraformusc.blob.core.windows.net" -Port 443 -InformationLevel Detailed
          
          Write-Host "`n=== Storage Account Access Tests ==="
          
          # Test 1: Check if we can authenticate
          try {
            Write-Host "1. Testing authentication..."
            $account = az storage account show --name sadevterraformusc --query "name" -o tsv 2>$null
            Write-Host "✅ Authentication successful. Account: $account"
          }
          catch {
            Write-Host "❌ Authentication failed: $_"
            exit 1
          }
          
          # Test 2: Check if we can list containers
          try {
            Write-Host "2. Testing container list permission..."
            az storage container list --account-name sadevterraformusc --auth-mode login --output table
            Write-Host "✅ Container list permission: OK"
          }
          catch {
            Write-Host "❌ Container list failed: $_"
          }
          
          # Test 3: Check if hello-world container exists
          try {
            Write-Host "3. Testing hello-world container access..."
            $container = az storage container show --name "hello-world" --account-name sadevterraformusc --auth-mode login --query "name" -o tsv 2>$null
            Write-Host "✅ Container 'hello-world' exists: $container"
          }
          catch {
            Write-Host "❌ Container 'hello-world' access failed: $_"
          }
          
          # Test 4: Check if we can list blobs (Read permission)
          try {
            Write-Host "4. Testing blob list permission..."
            az storage blob list --container-name "hello-world" --account-name sadevterraformusc --auth-mode login --output table --query "[].name" 2>$null
            Write-Host "✅ Blob list permission: OK"
          }
          catch {
            Write-Host "❌ Blob list failed: $_"
          }
          
          # Test 5: Try to create a test blob (Write permission)
          try {
            Write-Host "5. Testing blob write permission..."
            $testContent = "test-$(Get-Date -Format 'yyyyMMdd-HHmmss')"
            $testBlob = "terraform-test-$(Build.BuildId).txt"
            
            echo $testContent | az storage blob upload `
              --container-name "hello-world" `
              --name $testBlob `
              --account-name sadevterraformusc `
              --auth-mode login `
              --overwrite true 2>$null
            
            Write-Host "✅ Blob write permission: OK (created $testBlob)"
            
            # Cleanup test blob
            az storage blob delete --container-name "hello-world" --name $testBlob --account-name sadevterraformusc --auth-mode login 2>$null
            Write-Host "✅ Test blob cleaned up"
          }
          catch {
            Write-Host "❌ Blob write permission failed: $_"
            Write-Host "⚠️  This is likely the cause of Terraform backend issues!"
          }
          
          Write-Host "`n=== Service Principal Info ==="
          try {
            $sp = az ad signed-in-user show --query "displayName" -o tsv 2>$null
            if ($sp) {
              Write-Host "Signed in as user: $sp"
            } else {
              $sp = az account show --query "user.name" -o tsv
              Write-Host "Signed in as: $sp"
            }
          }
          catch {
            Write-Host "Could not determine signed-in user"
          }

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: 'latest'

    - task: AzureCLI@2
      displayName: 'Terraform Init and Plan'
      inputs:
        azureSubscription: '$(AzureResourceManagerSC)'
        scriptType: 'pscore' #'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
        inlineScript: |
          # Define a unique state file key for this build
          $STATE_FILE_KEY = "helloworld-$(EnvironmentName)-$(Build.BuildId).tfstate"
          Write-Host "Using state file: $STATE_FILE_KEY"
          
          terraform init `
            --backend-config="key=$STATE_FILE_KEY" `
            --reconfigure
          
          terraform plan `
            --var="container_app_name=$(ContainerAppName)" `
            --var="environment=$(EnvironmentName)" `
            --var="location=$(Region)" `
            --var="existing_cae_resource_group_name=$(ResourceGroup)" `
            --var="existing_container_app_environment_name=$(ContainerAppEnvironmentName)" `
            --var="managed_identity_name=$(ManagedIdentityName)" `
            --var="managed_identity_resource_group_name=$(ManagedIdentityResourceGroupName)" `
            --var="container_registry_login_server=$(ContainerRegistryLoginServer)" `
            --var="container_image=$(ContainerRegistryLoginServer)/$(ContainerRegistryRepository):$(Build.BuildId)" `
            --var="target_port=8080" `
            --out=tfplan

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Terraform Plan'
      inputs:
        targetPath: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
        artifact: 'terraform-plan'
        publishLocation: 'pipeline'

- stage: Deploy
  displayName: Terraform Apply Stage
  dependsOn: TerraformPlan
  condition: succeeded('TerraformPlan')
  pool: "WindowsAgents"
  jobs:
  - deployment: Deploy
    displayName: Deploy job
    environment: 'Dev'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
            path: s/helloworld

          - task: DownloadPipelineArtifact@2
            displayName: 'Download Terraform Plan'
            inputs:
              buildType: 'current'
              artifactName: 'terraform-plan'
              targetPath: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'

          - task: TerraformInstaller@1
            displayName: Install Terraform
            inputs:
              terraformVersion: 'latest'

          - task: AzureCLI@2
            displayName: 'Terraform Init and Apply'
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'pscore' #'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(Pipeline.Workspace)/s/helloworld/Infrastructure/Terraform'
              inlineScript: |
                # Define a unique state file key for this build
                $STATE_FILE_KEY = "helloworld-$(EnvironmentName)-$(Build.BuildId).tfstate"
                Write-Host "Using state file: $STATE_FILE_KEY"
                
                terraform init `
                  --backend-config="key=$STATE_FILE_KEY" `
                  --reconfigure
                
                terraform apply --auto-approve tfplan

          - template: Templates/Tasks/InitializeCAE1.yml@infrastructure
            parameters:
              ServiceConnectionName: '$(AzureResourceManagerSC)'
              EnvironmentName: '$(EnvironmentName)'
              BrowserFriendlyRouting: true
              ContainerAppFilter: '^$(ContainerAppName)$'
              InternalOnly: true

          - task: AzureCLI@2
            displayName: 'Get CA URL'
            name: retrieveurl
            inputs:
              azureSubscription: '$(AzureResourceManagerSC)'
              scriptType: 'pscore'
              scriptLocation: 'inlineScript'
              inlineScript: |
                $aca = az containerapp list -g $(ResourceGroup) | ConvertFrom-Json | Where-Object {$_.name -eq "$(ContainerAppName)"} | Select-Object -First 1
                $url = "https://" + $aca.properties.configuration.ingress.fqdn
                Write-Host "##vso[task.setvariable variable=IngressContainerAppUrl;isOutput=true]$url"

                $deployment = '$(ContainerAppName)-$(EnvironmentName).dev.ncontracts.com'
                Write-Host "DevNcontracts Container App URL: $deployment"
                Write-Host "##vso[task.setvariable variable=ContainerAppUrl;isOutput=true]$deployment"
      
